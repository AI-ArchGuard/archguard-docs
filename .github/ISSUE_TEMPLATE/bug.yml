name: 缺陷报告
description: 报告一个可复现的文档或规范缺陷
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 安全漏洞请按 SECURITY.md 私密报告，不要创建公开 Issue。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 指出冲突、错误链接或不可执行规范及其影响。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期内容或行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 相关路径与证据
      description: 仅提供最小必要信息，不得包含敏感数据。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已移除凭据、真实客户源码和个人数据。
          required: true
        - label: 我已检查现有 Issue，未发现重复报告。
          required: true
